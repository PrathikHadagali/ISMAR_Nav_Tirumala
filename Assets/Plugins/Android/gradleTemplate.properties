org.gradle.jvmargs=-Xmx**JVM_HEAP_SIZE**M -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true

# If the Android build fails with
#     java.io.IOException: Unable to establish loopback connection
# a VPN tunnel (WireGuard / ProtonVPN) is almost always the cause: Gradle's
# daemon handshake runs over a loopback socket that the tunnel intercepts.
# Disconnecting the VPN is the reliable fix. Uncommenting the line below
# forces Gradle in-process, which helps on some setups at the cost of slower
# cold builds.
# org.gradle.daemon=false

unityStreamingAssets=**STREAMING_ASSETS**
**ADDITIONAL_PROPERTIES**
